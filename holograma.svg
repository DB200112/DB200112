<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <rect width="1000" height="750" fill="url(#bg)"/>
  <ellipse cx="500" cy="400" rx="450" ry="350" fill="url(#halo)"/>
  
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-16; 0,0; 0,16; 0,0" dur="9s" repeatCount="indefinite"/>
    
    <g fill="#ffffff" filter="url(#soft)">
      
      <!-- HEAD -->
      <ellipse cx="500" cy="640" rx="34" ry="42"/>
      
      <!-- NECK -->
      <path d="M 484,596 L 516,596 L 514,616 L 486,616 Z"/>
      
      <!-- TORSO -->
      <path d="M 448,548
               Q 442,500 440,455
               Q 438,425 442,400
               L 558,400
               Q 562,425 560,455
               Q 558,500 552,548
               Z"/>
      
      <!-- SHOULDERS -->
      <ellipse cx="500" cy="552" rx="58" ry="17"/>
      
      <!-- LEFT ARM -->
      <path d="M 450,548
               Q 405,555 355,568
               Q 305,582 255,595
               Q 220,604 195,610
               L 190,600
               Q 218,594 252,586
               Q 302,573 352,560
               Q 402,547 450,540 Z"/>
      
      <!-- LEFT HAND -->
      <path d="M 195,610 Q 172,616 165,608 Q 172,600 190,602 Z"/>
      
      <!-- RIGHT ARM -->
      <path d="M 550,548
               Q 595,555 645,568
               Q 695,582 745,595
               Q 780,604 805,610
               L 810,600
               Q 782,594 748,586
               Q 698,573 648,560
               Q 598,547 550,540 Z"/>
      
      <!-- RIGHT HAND -->
      <path d="M 805,610 Q 828,616 835,608 Q 828,600 810,602 Z"/>
      
      <!-- HIPS -->
      <ellipse cx="500" cy="400" rx="52" ry="26"/>
      
      <!-- LEFT LEG -->
      <path d="M 466,395
               Q 460,320 458,240
               Q 457,170 462,110
               L 490,110
               Q 487,170 488,240
               Q 492,320 497,395
               Z"/>
      
      <!-- RIGHT LEG -->
      <path d="M 503,395
               Q 508,320 512,240
               Q 513,170 510,110
               L 538,110
               Q 543,170 542,240
               Q 540,320 535,395
               Z"/>
      
      <!-- LEFT FOOT -->
      <ellipse cx="476" cy="100" rx="16" ry="11"/>
      
      <!-- RIGHT FOOT -->
      <ellipse cx="524" cy="100" rx="16" ry="11"/>
      
    </g>
  </g>
  
  <!-- Partículas flotando -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="200" cy="250" r="1.5">
      <animate attributeName="cy" values="250;180;250" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="300" r="1.8">
      <animate attributeName="cy" values="300;230;300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="500" r="1.2">
      <animate attributeName="cy" values="500;440;500" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="480" r="1.5">
      <animate attributeName="cy" values="480;410;480" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.08;0.4" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="180" r="1">
      <animate attributeName="cy" values="180;120;180" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="200" r="1.3">
      <animate attributeName="cy" values="200;140;200" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
