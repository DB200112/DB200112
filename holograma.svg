<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <rect width="1000" height="500" fill="#000000"/>

  <g fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0;0,10;0,0" dur="6s" repeatCount="indefinite"/>

    <!-- Cabeza -->
    <ellipse cx="500" cy="360" rx="22" ry="26"/>

    <!-- Cuello y torso -->
    <path d="M 480,338 Q 500,330 520,338 L 528,235 Q 500,222 472,235 Z"/>

    <!-- Brazo izquierdo -->
    <path d="M 478,320 Q 390,300 325,278 L 320,295 Q 385,318 472,338 Z"/>

    <!-- Brazo derecho -->
    <path d="M 522,320 Q 610,300 675,278 L 680,295 Q 615,318 528,338 Z"/>

    <!-- Manos -->
    <ellipse cx="322" cy="286" rx="10" ry="8"/>
    <ellipse cx="678" cy="286" rx="10" ry="8"/>

    <!-- Pierna izquierda -->
    <path d="M 488,230 L 476,110 L 490,110 L 498,230 Z"/>

    <!-- Pierna derecha -->
    <path d="M 512,230 L 524,110 L 510,110 L 502,230 Z"/>

    <!-- Pies -->
    <ellipse cx="482" cy="102" rx="8" ry="6"/>
    <ellipse cx="518" cy="102" rx="8" ry="6"/>
  </g>

  <!-- Scanlines sutiles, muy tenues -->
  <g opacity="0.08" fill="#ffffff">
    <rect y="40" width="1000" height="1"/>
    <rect y="90" width="1000" height="1"/>
    <rect y="140" width="1000" height="1"/>
    <rect y="190" width="1000" height="1"/>
    <rect y="240" width="1000" height="1"/>
    <rect y="290" width="1000" height="1"/>
    <rect y="340" width="1000" height="1"/>
    <rect y="390" width="1000" height="1"/>
    <rect y="440" width="1000" height="1"/>
  </g>
</svg>
