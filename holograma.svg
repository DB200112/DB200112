<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#d4a04a"/>
      <stop offset="45%" stop-color="#7a5520"/>
      <stop offset="100%" stop-color="#0a0500"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#ffe6a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#050200"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.5" fill="#f5a623" opacity="0.15"/>
    </pattern>
    <filter id="glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.9" numOctaves="1" result="noise">
        <animate attributeName="seed" values="1;5;3;8;2;7;4" dur="0.8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>

  <rect width="1000" height="400" fill="url(#bg)"/>
  <ellipse cx="500" cy="180" rx="350" ry="220" fill="url(#glow)"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0;0,10;0,0" dur="7s" repeatCount="indefinite"/>
    <g filter="url(#glitch)">
      <ellipse cx="472" cy="70" rx="12" ry="8" fill="#0a0500"/>
      <ellipse cx="528" cy="70" rx="12" ry="8" fill="#0a0500"/>
      <path d="M 465,65 L 480,190 L 490,190 L 480,65 Z" fill="#0a0500"/>
      <path d="M 520,65 L 510,190 L 520,190 L 535,65 Z" fill="#0a0500"/>
      <path d="M 465,185 Q 500,200 535,185 L 545,210 Q 500,225 455,210 Z" fill="#0a0500"/>
      <path d="M 455,210 Q 450,250 460,275 L 540,275 Q 550,250 545,210 Z" fill="#0a0500"/>
      <path d="M 460,240 Q 400,245 350,260 L 340,250 Q 395,230 460,225 Z" fill="#0a0500"/>
      <path d="M 540,240 Q 600,245 650,260 L 660,250 Q 605,230 540,225 Z" fill="#0a0500"/>
      <ellipse cx="340" cy="255" rx="8" ry="10" fill="#0a0500"/>
      <ellipse cx="660" cy="255" rx="8" ry="10" fill="#0a0500"/>
      <rect x="492" y="275" width="16" height="12" fill="#0a0500"/>
      <ellipse cx="500" cy="305" rx="22" ry="25" fill="#0a0500"/>
    </g>
  </g>

  <path d="M 0,330 Q 250,320 500,335 T 1000,330 L 1000,400 L 0,400 Z" fill="url(#water)" opacity="0.9"/>
  <ellipse cx="500" cy="345" rx="120" ry="10" fill="#f5a623" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="120;140;120" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <rect width="1000" height="400" fill="url(#scan)">
    <animate attributeName="y" values="0;3;0" dur="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="400" fill="#f5a623" opacity="0">
    <animate attributeName="opacity" values="0;0;0.04;0;0;0;0.06;0;0;0.03;0;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#f5a623" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 20,20 L 20,70 M 20,20 L 70,20"/>
    <path d="M 980,20 L 980,70 M 980,20 L 930,20"/>
    <path d="M 20,380 L 20,330 M 20,380 L 70,380"/>
    <path d="M 980,380 L 980,330 M 980,380 L 930,380"/>
  </g>

  <text x="90" y="40" fill="#f5a623" font-family="monospace" font-size="14" opacity="0.8" letter-spacing="3">◢ HOLOGRAM // ACTIVE</text>
  <text x="910" y="365" text-anchor="end" fill="#f5a623" font-family="monospace" font-size="12" opacity="0.7" letter-spacing="2">NIGHT CITY // 2077</text>
  <text x="500" y="385" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="11" opacity="0.6" letter-spacing="4">▸ AFTERLIFE NETWORK ◂</text>
</svg>
